<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reloj Digital | Futuristic Digital Clock</title>

    <!-- Fuente futurista -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="clock-container">
      <!-- Fondo con efectos -->
      <div class="particles"></div>
      <!-- =========================
             RELOJ ANALÓGICO
        =========================== -->
      <section class="analog-clock">
        <div class="clock-face">
          <!-- Marcas de minutos -->
          <div class="markers"></div>

          <!-- Números del reloj -->
          <div class="numbers">
            <span class="number n12">12</span>
            <span class="number n1">1</span>
            <span class="number n2">2</span>
            <span class="number n3">3</span>
            <span class="number n4">4</span>
            <span class="number n5">5</span>
            <span class="number n6">6</span>
            <span class="number n7">7</span>
            <span class="number n8">8</span>
            <span class="number n9">9</span>
            <span class="number n10">10</span>
            <span class="number n11">11</span>
          </div>

          <!-- Aguja de horas -->
          <div class="hand hour-hand" id="hour">
            <span></span>
          </div>

          <!-- Aguja de minutos -->
          <div class="hand minute-hand" id="min">
            <span></span>
          </div>

          <!-- Aguja de segundos -->
          <div class="hand second-hand" id="sec">
            <span></span>
          </div>

          <!-- Centro del reloj -->
          <div class="center-dot"></div>
        </div>
      </section>

      <!-- ==========================
             RELOJ DIGITAL
        =========================== -->
      <section class="digital-clock">
        <!-- Hora digital -->
        <h1 class="time" id="time">00:00:00</h1>
        <!-- Fecha -->
        <p class="date" id="date">LUNES • 01 ENERO 2026</p>
      </section>

      <!-- Estado del sistema -->
      <div class="mode" id="mode">🌙 NIGHT MODE</div>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
